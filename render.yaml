# Free Render Blueprint for the synthetic Fashion Finder demo.
# Both services use the Free plan. The API's temporary /tmp data is reseeded at
# startup; it is intentionally not a persistent real-product catalogue.
services:
  - type: web
    name: fashion-finder-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/render-api-start.sh
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - Dockerfile.api
        - .dockerignore
        - pyproject.toml
        - README.md
        - manage.py
        - src/**
        - scripts/render-api-start.sh
    envVars:
      - key: PORT
        value: "10000"
      - key: FASHION_FINDER_SECRET_KEY
        generateValue: true
      - key: FASHION_FINDER_ALLOWED_HOSTS
        value: fashion-finder-api.onrender.com,fashion-finder-api,localhost,127.0.0.1
      - key: FASHION_FINDER_DATA_DIR
        value: /tmp/fashion-finder-data
      - key: FASHION_FINDER_DEMO_MODE
        value: "1"

  - type: web
    name: fashion-finder-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - web/**
    envVars:
      # Free web services cannot receive private-network traffic, so use the
      # API's public HTTPS endpoint. Its name matches the API service above.
      - key: FASHION_FINDER_API_INTERNAL_URL
        value: https://fashion-finder-api.onrender.com
      - key: HOSTNAME
        value: 0.0.0.0
