# Free Render Blueprint for the public Fashion Finder demo.
# Both services use the Free plan. The API keeps its catalogue in temporary /tmp
# storage: it is empty after every deploy and every wake-up (the free instance sleeps
# after 15 minutes without traffic). The scheduled GitHub Actions run
# (.github/workflows/fashion-finder-refresh.yml) refills it through the token-protected
# ingest API. Public display follows config/source-policies.render-listing.json:
# product names, prices, shop links and photos shown from the shops' own image
# servers; photo processing is approved too (owner decision 2026-10-25, without
# retailer permission). Photo search still needs a photo index, which this free
# instance cannot build (docs/scraper.md, "Hosted demo").
services:
  - type: web
    name: fashion-finder-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/render-api-start.sh
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - Dockerfile.api
        - .dockerignore
        - pyproject.toml
        - README.md
        - manage.py
        - src/**
        - scripts/render-api-start.sh
        - config/source-policies.render-listing.json
    envVars:
      - key: PORT
        value: "10000"
      - key: FASHION_FINDER_SECRET_KEY
        generateValue: true
      - key: FASHION_FINDER_ALLOWED_HOSTS
        value: fashion-finder-api.onrender.com,fashion-finder-api,localhost,127.0.0.1
      - key: FASHION_FINDER_DATA_DIR
        value: /tmp/fashion-finder-data
      # The free instance has 512 MB: one gunicorn worker (2 measured 865 MB with models).
      - key: WEB_CONCURRENCY
        value: "1"
      # Real shops instead of the synthetic demo catalogue.
      - key: FASHION_FINDER_DEMO_MODE
        value: "0"
      - key: FASHION_FINDER_SOURCE_POLICIES
        value: /app/config/source-policies.render-listing.json
      # Offers arrive through the ingest API, not partner CSV files.
      - key: FASHION_FINDER_FEED_WORKER
        value: "0"
      # Bearer token for /api/v1/ingest/*. Copy it from the Render dashboard into the
      # GitHub secret FASHION_FINDER_API_TOKEN (docs/scraper.md, "Hosted demo").
      - key: FASHION_FINDER_INGEST_TOKEN
        generateValue: true

  - type: web
    name: fashion-finder-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - web/**
    envVars:
      # Free web services cannot receive private-network traffic, so use the
      # API's public HTTPS endpoint. Its name matches the API service above.
      - key: FASHION_FINDER_API_INTERNAL_URL
        value: https://fashion-finder-api.onrender.com
      - key: HOSTNAME
        value: 0.0.0.0
