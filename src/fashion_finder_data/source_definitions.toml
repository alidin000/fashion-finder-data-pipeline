# Hungarian source definitions: one [sources.<key>] table per storefront or feed.
#
# Adding a shop that publishes schema.org structured data is mostly configuration.
# See docs/scraper.md ("Add a source"). Every field below is validated by
# `sources.load_definitions`; an invalid file stops the program at import time.
#
# status:
#   reviewed   - live collection verified and documented in docs/live-source-status.md
#   blocked    - the shop blocked bounded checks from this environment; never in `collect all`
#   candidate  - configured from the research docs; not live-verified; never in `collect all`
#   feed-only  - only an authorized local feed may supply offers; no crawling
#   demo       - synthetic local data
#
# A definition never grants publication. Source policies (config/source-policies*.json)
# stay pending until the owner records evidence and approves them.

[sources.zara]
name = "Zara"
host = "zara.com"
status = "blocked"
category_url = "https://www.zara.com/hu/en/woman-jackets-l1114.html"
category = "jackets"
product_pattern = '-p\d+\.html(?:$|\?)'
notes = "HTTP 403 for robots.txt, category and browser checks on 2026-10-12."

