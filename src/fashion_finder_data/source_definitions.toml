# --- Candidates added on 2026-10-24 (policy pending; not in `collect all`) ---------------
# robots.txt for each host was read on 2026-10-24 with the FashionFinderBot token and
# allows the configured paths. docs/data-research/hungarian-shop-survey.md found no
# automated-access clause in search excerpts of their terms; the full terms were not read.

[sources.sportano]
name = "Sportano"
host = "sportano.hu"
hosts = ["sportano.hu", "www.sportano.hu"]
status = "candidate"
market_paths = ["/"]
# From robots.txt (2026-10-24). Child sitemaps are filtered by `sitemap_follow`; the
# research counted 23 product sitemaps but did not record their names, so this filter
# is unverified: a run that matches none reports the child names it saw.
sitemaps = ["https://sportano.hu/sitemap/sitemap_hu.xml"]
sitemap_follow = 'product'
notes = "Product JSON-LD with HUF offers per the 2026-10-13 survey. Sitemap discovery only."

[sources.ecipo]
name = "eCipő"
host = "ecipo.hu"
hosts = ["ecipo.hu", "www.ecipo.hu"]
status = "candidate"
market_paths = ["/"]
product_pattern = '^https://(?:www\.)?ecipo\.hu/p/'
extraction = { title_suffix = '\s*\|\s*Ecipo\.hu\s*$' }
notes = "ProductGroup JSON-LD. No sitemap in robots.txt and no documented category URL: pass --url."

[sources.modivo]
name = "Modivo"
host = "modivo.hu"
hosts = ["modivo.hu", "www.modivo.hu"]
status = "candidate"
market_paths = ["/"]
product_pattern = '^https://(?:www\.)?modivo\.hu/p/'
notes = "ProductGroup JSON-LD; category pages carry a priceless AggregateOffer node. Pass --url."

