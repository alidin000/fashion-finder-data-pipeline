name: Fashion Finder product refresh

# Updates the catalogue through the authenticated ingest API every 12 hours.
# The runner keeps nothing: results go straight to the Django database.
# Scheduled runs use the repository variable FASHION_FINDER_SCHEDULED_COMMAND, default
# "discover": the free Render demo's database is temporary, so after a wipe nothing is
# due for "refresh" and the catalogue must be found again. Set it to "refresh" once the
# API has a persistent database.
# After the catalogue run, "index-photos" builds the API's photo index: it downloads
# photos politely, encodes them with the pinned INT8 vision model and uploads only the
# vectors. Vectors (never photos) are kept between runs with actions/cache, so after the
# free API's wipe-on-sleep the index is rebuilt without downloading the photos again.
# Time plan (job limit 120 min): setup ~3, wake <=3, catalogue run 50 (+2 to upload),
# model and cache ~2, photo index 45 (+1), cache save ~1 = at most ~107 min.
# The same command runs unchanged as a Render cron job or on a self-hosted runner;
# see docs/scraper.md ("Scheduled refresh") before enabling this on a fork.

on:
  schedule:
    - cron: "17 8,20 * * *"
      timezone: "Europe/Budapest"
  workflow_dispatch:
    inputs:
      command:
        description: "discover (find offers; needed after the temporary database is wiped) or refresh (due offers)"
        type: choice
        options: [discover, refresh]
        default: discover
      limit:
        description: "Offers to check this run (refresh) or per source (discover)"
        required: false
        default: "500"
      source:
        description: "One source key, e.g. reserved (empty: every reviewed source)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fashion-finder-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FASHION_FINDER_API_URL: ${{ secrets.FASHION_FINDER_API_URL }}
      FASHION_FINDER_API_TOKEN: ${{ secrets.FASHION_FINDER_API_TOKEN }}
      FASHION_FINDER_CONTACT_URL: ${{ vars.FASHION_FINDER_CONTACT_URL }}
      COMMAND: ${{ inputs.command || vars.FASHION_FINDER_SCHEDULED_COMMAND || 'discover' }}
      LIMIT: ${{ inputs.limit || '500' }}
      SOURCE: ${{ inputs.source || '' }}
      # Discovery or refresh stops after this; it was 100 before the photo index step.
      CRAWL_BUDGET_MINUTES: "50"
      # Photos: 4 of the 5 image hosts ask for Crawl-delay 10 s, so a cold cache indexes
      # about 1,300 photos in 45 min; later runs reuse the cached vectors.
      PHOTO_BUDGET_MINUTES: "45"
      PHOTO_LIMIT: "1500"
      # Marqo-FashionSigLIP INT8 vision tower (Apache-2.0), pinned to one revision and hash;
      # the API (Dockerfile.api) downloads and checks the same file.
      MODEL_URL: https://huggingface.co/Marqo/marqo-fashionSigLIP/resolve/c56244cc94f92419e8369fa71efdaf403b124ce8/onnx/vision_model_quantized.onnx
      MODEL_SHA256: f1009cfce0eedd409f601e8351eedab72e8529641105eee6517821a9a634a2f4
      MODEL_PATH: ${{ github.workspace }}/.fashion-finder/models/fashion-siglip-vision-int8.onnx
      EMBEDDING_CACHE: ${{ github.workspace }}/.fashion-finder/embeddings
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$FASHION_FINDER_API_URL" ] || [ -z "$FASHION_FINDER_API_TOKEN" ]; then
            echo "::notice title=Refresh skipped::Set the FASHION_FINDER_API_URL and FASHION_FINDER_API_TOKEN secrets to enable the scheduled refresh (docs/scraper.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          case "$COMMAND" in refresh|discover) ;; *) echo "::error::unknown command"; exit 1 ;; esac
          case "$LIMIT" in ''|*[!0-9]*) echo "::error::limit must be a number"; exit 1 ;; esac
          case "$SOURCE" in ''|[a-z]*) ;; *) echo "::error::invalid source"; exit 1 ;; esac
          case "$SOURCE" in *[!a-z0-9_]*) echo "::error::invalid source"; exit 1 ;; esac
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the scraper
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -e .
      - name: Check whether a selected source needs a browser
        id: browser
        if: steps.config.outputs.ready == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from fashion_finder_data.sources import CRAWL_SOURCES, DEFAULT_COLLECT_SOURCES
          selected = [CRAWL_SOURCES[os.environ["SOURCE"]]] if os.environ["SOURCE"] else DEFAULT_COLLECT_SOURCES.values()
          print("needed=" + str(any(source.rendering == "browser" for source in selected)).lower())
          PY
      - name: Install Chromium (only for sources marked rendering = "browser")
        if: steps.config.outputs.ready == 'true' && steps.browser.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Wake the API
        if: steps.config.outputs.ready == 'true'
        # A sleeping free Render instance takes about a minute to start.
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 15 \
            --max-time 60 --output /dev/null "${FASHION_FINDER_API_URL%/}/api/v1/health"
      - name: Run
        if: steps.config.outputs.ready == 'true'
        timeout-minutes: 58
        run: |
          if [ "$COMMAND" = "refresh" ]; then
            set -- refresh --limit "$LIMIT" --time-budget-minutes "$CRAWL_BUDGET_MINUTES"
            [ -n "$SOURCE" ] && set -- "$@" --source "$SOURCE"
          else
            set -- collect "${SOURCE:-all}" --all-categories --limit "$LIMIT" \
              --time-budget-minutes "$CRAWL_BUDGET_MINUTES"
          fi
          # API mode: due offers come from the API and results go back to it in batches.
          fashion-finder "$@"
      - name: Install the image model runtime
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -e '.[image-model]'
      - name: Restore the image model
        id: model-cache
        if: steps.config.outputs.ready == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: fashion-siglip-vision-int8-${{ env.MODEL_SHA256 }}
      - name: Download and verify the image model
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p "$(dirname "$MODEL_PATH")"
            curl --fail --location --silent --show-error --retry 3 --max-time 600 \
              --output "$MODEL_PATH" "$MODEL_URL"
          fi
          # A restored or downloaded file must match the pinned hash; anything else stops here.
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum --check --strict
      - name: Save the image model
        if: steps.config.outputs.ready == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: fashion-siglip-vision-int8-${{ env.MODEL_SHA256 }}
      - name: Restore the embedding cache
        if: steps.config.outputs.ready == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.EMBEDDING_CACHE }}
          # Cache entries are immutable: each run saves under its own key, and the
          # newest earlier one is restored through the prefix.
          key: fashion-finder-embeddings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fashion-finder-embeddings-
      - name: Index photos
        if: steps.config.outputs.ready == 'true'
        timeout-minutes: 50
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 15 \
            --max-time 60 --output /dev/null "${FASHION_FINDER_API_URL%/}/api/v1/health"
          set -- index-photos --limit "$PHOTO_LIMIT" --per-offer 1 --model-path "$MODEL_PATH" \
            --cache-dir "$EMBEDDING_CACHE" --time-budget-minutes "$PHOTO_BUDGET_MINUTES"
          [ -n "$SOURCE" ] && set -- "$@" --source "$SOURCE"
          # Photos stay in memory until encoded; only vectors reach the cache and the API.
          fashion-finder "$@"
      - name: Save the embedding cache
        # Also after a failed or timed-out step: the vectors already encoded are kept.
        if: always() && steps.config.outputs.ready == 'true' && hashFiles('.fashion-finder/embeddings/embedding-cache.json') != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.EMBEDDING_CACHE }}
          key: fashion-finder-embeddings-${{ github.run_id }}-${{ github.run_attempt }}
