[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-finder-data"
version = "0.1.0"
description = "Local-first product data ingestion pipeline for Fashion Finder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Scrapy>=2.11",
  "scrapy-playwright>=0.0.40",
  "playwright>=1.45",
  "pydantic>=2.7",
  "SQLAlchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.12",
  "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx>=0.27",
]
crawlee-benchmark = [
  "crawlee[parsel]>=1.10,<2",
]

[project.scripts]
fashion-finder = "fashion_finder_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
